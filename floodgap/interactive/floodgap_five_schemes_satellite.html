const map = L.map('map').setView([29.72,-95.25], 9);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'&copy; Esri World Imagery'}).addTo(map);

const layers = D.map(d => {
  const c = L.circleMarker([d[0],d[1]],{radius:4,weight:1,color:'#888',fillOpacity:.75});
  c.bindPopup('<b>'+d[8]+'</b><br>'+(d[7]=='H'?'Harris':'Galveston')+' County');
  return c.addTo(map);
});

function color(v){ // yellow -> red
  const r=255, g=Math.round(237-190*v), b=Math.round(160-130*v);
  return 'rgb('+r+','+Math.max(g,40)+','+Math.max(b,30)+')';
}
function get(id){return +document.getElementById(id).value;}
function upd(){
  let wt=get('w_t'), ws=get('w_s'), wr=get('w_r');
  let subsum = wt+ws+wr || 1; wt/=subsum; ws/=subsum; wr/=subsum;
  let wcf=get('w_cf'), wsv=get('w_sv'), wcv=get('w_cv');
  let osum = wcf+wsv+wcv || 1; wcf/=osum; wsv/=osum; wcv/=osum;
  ['t','s','r'].forEach((k,i)=>document.getElementById('v_'+k).textContent=Math.round([wt,ws,wr][i]*100));
  ['cf','sv','cv'].forEach((k,i)=>document.getElementById('v_'+k).textContent=Math.round([wcf,wsv,wcv][i]*100));

  // compound raw then minmax
  const comp = D.map(d => wt*d[2] + ws*d[3] + wr*d[4]);
  const lo = Math.min(...comp), hi = Math.max(...comp), rg = (hi-lo)||1;
  const scores = D.map((d,i) => wcf*(comp[i]-lo)/rg + wsv*d[5] + wcv*d[6]);
  // rank
  const idx = scores.map((s,i)=>i).sort((a,b)=>scores[b]-scores[a]);
  const top20 = new Set(idx.slice(0,20));
  const top50 = idx.slice(0,50);
  const slo = Math.min(...scores), shi = Math.max(...scores), srg=(shi-slo)||1;
  layers.forEach((c,i)=>{
    const v=(scores[i]-slo)/srg;
    c.setStyle({fillColor:color(v), color: top20.has(i)?'#FFFFFF':'#222',
                weight: top20.has(i)?2.5:0.6, radius: top20.has(i)?8:4,
                fillOpacity: top20.has(i)?0.95:0.8});
  });
  let h=0,g=0; top50.forEach(i=>{ D[i][7]=='H'?h++:g++; });
  document.getElementById('stats').innerHTML =
    'Top 50 high-score tracts:<br><b>Harris: '+h+'</b> &nbsp;|&nbsp; <b>Galveston: '+g+'</b>'+
    '<br><span style="font-size:11px;color:#8FB0C2">tidal-only gave Harris only 3 / 50</span>';
}
function preset(t,s,r){document.getElementById('w_t').value=t;document.getElementById('w_s').value=s;document.getElementById('w_r').value=r;upd();}
document.querySelectorAll('input[type=range]').forEach(el=>el.addEventListener('input',upd));
upd();
</script></body></html>
